name: Daily UFO update

# Runs once per day at 02:00 UTC (~10:00 Taipei time),
# also runnable on-demand from the Actions tab via "Run workflow".
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # so the bot can commit the refreshed data.json
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper (downloads CSV, translates, writes data.json)
        run: python scraper/scrape.py

      - name: Commit updated data.json + cache
        run: |
          git config user.name  "ufo-tracker-bot"
          git config user.email "ufo-tracker-bot@users.noreply.github.com"
          git add data.json scraper/cache/state.json scraper/cache/translations.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily UFO data refresh ($(date -u +'%Y-%m-%d %H:%MZ'))"
            git push
          fi

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out (with the fresh commit from scrape job)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact (whole repo as the site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
